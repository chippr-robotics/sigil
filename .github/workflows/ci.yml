name: CI

on:
  push:
    branches: [main, staging, "claude/**"]
  pull_request:
    # `staging` is an integration branch. Without it here, a PR targeting
    # staging from any branch not matching the push filter above gets no CI
    # at all.
    branches: [main, staging]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # Format Check
  # ============================================
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    # Read-only. This job used to hold `contents: write` and push
    # "style: auto-fix formatting" commits to the branch under test. A gate
    # that silently rewrites the code it is gating is not a gate, and CI
    # write access to branches is an unaudited path to shipped code in a
    # key-custody repository. See Constitution Principle V.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          if cargo fmt --all -- --check; then
            echo "✅ All files are properly formatted" >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "## ❌ Formatting issues"
              echo ""
              echo "Run this locally and commit the result:"
              echo ""
              echo '```bash'
              echo "cargo fmt --all"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ============================================
  # Lint Check
  # ============================================
  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    # Read-only, for the same reason as Format Check above. `clippy --fix`
    # also does not run rustfmt, so the commits this job used to push were
    # routinely not fmt-clean, which put it in a loop with Format Check.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Check Clippy
        run: |
          if cargo clippy --workspace --all-targets -- -D warnings; then
            echo "✅ No clippy warnings found" >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "## ❌ Clippy warnings"
              echo ""
              echo "Reproduce and fix locally:"
              echo ""
              echo '```bash'
              echo "cargo clippy --workspace --all-targets -- -D warnings"
              echo "cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged"
              echo "cargo fmt --all   # clippy --fix does not format what it rewrites"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ============================================
  # Build Check
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build all targets
        run: cargo build --workspace --all-targets

      - name: Build release
        run: cargo build --workspace --release

  # ============================================
  # Unit Tests
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # This used to be a hand-maintained list of five `-p` invocations, which
      # silently omitted sigil-frost (threshold crypto, in the TCB),
      # sigil-mcp, sigil-mother-tui and sigil-bridge — 135 tests that never
      # ran in a gating job, including every test asserting the TCB
      # invariants. A green "Unit Tests" that skips the security tests is the
      # definition of checkbox theater. Use the whole workspace so a new
      # crate is covered the day it is added.
      #
      # sigil-zkvm is excluded only because its `sigil-zkvm-program` binary is
      # an SP1 guest program that exits non-zero outside a zkVM; its library
      # tests run in the step after. This mirrors the Code Coverage job.
      - name: Run tests (whole workspace)
        run: cargo test --workspace --exclude sigil-zkvm --verbose

      - name: Run unit tests (sigil-zkvm library only)
        run: cargo test -p sigil-zkvm --lib --verbose

      - name: Run tests (sigil-mcp with mock feature)
        # The mock harness is behind a non-default feature; build it too, so
        # "mock mode refuses to sign" stays covered in both configurations.
        run: cargo test -p sigil-mcp --features mock --verbose

  # ============================================
  # Integration Tests
  # ============================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-

      - name: Run integration tests (sigil-core)
        run: cargo test -p sigil-core --test disk_format_tests --verbose

      - name: Run integration tests (sigil-mother)
        run: cargo test -p sigil-mother --test ceremony_tests --verbose

  # ============================================
  # End-to-End Tests
  # ============================================
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Run E2E tests
        run: cargo test -p sigil-tests --test e2e_workflow_test --verbose

  # ============================================
  # Code Coverage
  # ============================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Generate coverage report
        # Exclude sigil-zkvm as it contains a binary that requires SP1 zkVM environment
        run: cargo llvm-cov --workspace --exclude sigil-zkvm --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # Documentation
  # ============================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ============================================
  # Security Audit
  # ============================================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # This job is a GATE. It previously ran with `continue-on-error: true`,
      # so it reported 22 vulnerabilities and went green anyway — a job named
      # "Security Audit" in a key-custody repository that could not fail.
      #
      # Exceptions are declared in .cargo/audit.toml, each with the reason and
      # the optional feature that pulls it in. An advisory reachable from a
      # default build is never ignored: it is fixed, or this fails.
      - name: Run security audit
        run: cargo audit

  # ============================================
  # Summary Job
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, build, test, integration, e2e, docs, audit]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.integration.result }}" != "success" ]] || \
             [[ "${{ needs.e2e.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"
