[package]
name = "sigil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claude CLI tools for Sigil MPC signing"

[[bin]]
name = "sigil"
path = "src/main.rs"

[dependencies]
sigil-core = { workspace = true }
sigil-daemon = { workspace = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# IPC transport is Unix domain sockets / Windows named pipes carrying JSON
# (see src/ipc/). `tonic` and `prost` were declared here but never referenced
# by any code and there is no build.rs generating proto types; they pulled an
# entire gRPC + hyper 0.14 + axum 0.6 stack into a TCB crate's dependency
# graph, carrying four RUSTSEC advisories. Removed. `proto/signer.proto` is
# retained as a design note; reintroduce these deliberately if it is ever
# implemented.

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Time
chrono = { workspace = true }
