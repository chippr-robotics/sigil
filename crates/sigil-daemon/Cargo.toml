[package]
name = "sigil-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "System daemon for Sigil disk watching and IPC"

[[bin]]
name = "sigil-daemon"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
sigil-core = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = "0.1"

# IPC transport is Unix domain sockets / Windows named pipes carrying JSON
# (see src/ipc/). `tonic` and `prost` were declared here but never referenced
# by any code and there is no build.rs generating proto types; they pulled an
# entire gRPC + hyper 0.14 + axum 0.6 stack into a TCB crate's dependency
# graph, carrying four RUSTSEC advisories. Removed. `proto/signer.proto` is
# retained as a design note; reintroduce these deliberately if it is ever
# implemented.

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bitcode = { workspace = true }
hex = { workspace = true }

# Cryptography
k256 = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# File matching
glob = "0.3"

# Async utilities
futures-util = "0.3"

# Platform-specific disk detection
[target.'cfg(target_os = "linux")'.dependencies]
tokio-udev = { workspace = true }

# Windows IPC (named pipes)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3.10"
