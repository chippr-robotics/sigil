[package]
name = "sigil-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MCP (Model Context Protocol) server for Sigil MPC signing"

[[bin]]
name = "sigil-mcp"
path = "src/main.rs"

[dependencies]
# Internal crates
sigil-core = { workspace = true }
sigil-daemon = { workspace = true }
sigil-cli = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time
chrono = { workspace = true }

# UUID for session IDs
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Self dev-dependency so integration tests (which are separate crates and so do
# not see this crate's `cfg(test)`) can build the mock harness.
sigil-mcp = { path = ".", features = ["mock"] }

[features]
default = []

# Mock daemon mode: fabricates disk *status* for harnessing agent clients
# without hardware. Deliberately NOT in `default` — see the crate's `client`
# module docs and Constitution Principle II. Mock mode never produces a
# signature; signing operations return `ClientError::MockSigningDisabled`.
mock = []
